spring:
  application:
    name: yume
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_HOST_URL:jdbc:mysql://localhost:3306/yume}
    username: ${DB_HOST_USERNAME}
    password: ${DB_HOST_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

google:
  maps:
    apiKey: ${GOOGLE_MAPS_API_KEY:${GOOGLE_MAPS_ROUTES_API_KEY:}}
    routes-api-key: ${GOOGLE_MAPS_ROUTES_API_KEY:}

navitime:
  rapid-api-key: ${NAVITIME_RAPID_API_KEY:}

server:
  port: ${SERVER_PORT:8080}
