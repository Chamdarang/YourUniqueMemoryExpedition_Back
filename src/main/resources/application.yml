spring:
  application:
    name: yume
  config:
    import: optional:file:.env[.properties],optional:file:back/.env[.properties]
  datasource:
    url: ${DB_HOST_URL:jdbc:mysql://localhost:3306/yume}
    username: ${DB_HOST_USERNAME}
    password: ${DB_HOST_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

google:
  maps:
    apiKey: ${GOOGLE_MAPS_API_KEY:${GOOGLE_MAPS_ROUTES_API_KEY:}}
    routes-api-key: ${GOOGLE_MAPS_ROUTES_API_KEY:}

navitime:
  rapid-api-key: ${NAVITIME_RAPID_API_KEY:}

auth:
  signup-enabled: ${AUTH_SIGNUP_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%thread] [requestId:%X{requestId:-}] %logger{36} : %msg%n%wEx"
